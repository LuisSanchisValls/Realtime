<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime</title>

    <style>
        #juego{
            border: 1px solid black;
            width: 500px;
            height: 500px;
            position: relative;
        }
        .jugador{
            width: 20px;
            height: 20px;
            background-color: red;
            position:absolute;
            left:100px;
            top:100px;
        }
        .fruta {
        width: 15px;
        height: 15px;
        background-color: green;
        border-radius: 50%;
        position: absolute;
        }

    </style>
</head>
<body>
<hi>Realtime:</hi>

    <div id="juego">
        <div class="jugador"id="plantilla"></div>
    </div>

    <div id="bloqueConectar">
        <input id="server" value="127.0.0.1">
        <button id="BotonConectar" >Conectar</button>
    </div>
</body>


<script>
//me guardo el jugador plantilla(blueprint)y lo quito de la escena
   var jugadorBlueprint=document.getElementById("plantilla");
   jugadorBlueprint.remove();

//conectar al server
var miconexion;
var miId=-1;
var frutaDiv = null;

document.getElementById("BotonConectar").addEventListener("click",()=>{ 
    var direccion= document.getElementById("server").value;
    miconexion = new WebSocket("ws://"+direccion+ ":8080" );
 
    //miconexion.addEventListener("open", ()=>{alert("me he conectado")});
    miconexion.addEventListener("message", (m)=>{

    //alert(m.data.toString());
     mensaje=JSON.parse(m.data.toString());

    if(mensaje.tipo=="new"){

        //el primer new que llega soy "yo"
        if(miId==-1)miId=mensaje.datos.id;

        //alguien nuevo ha llegado->lo creo en la escena
            nuevoJugador=jugadorBlueprint.cloneNode(true);//clone Prefab
            nuevoJugador.id=mensaje.datos.id;
            nuevoJugador.dataset.dir=mensaje.datos.dir;
            nuevoJugador.dataset.posx=mensaje.datos.posx;
            nuevoJugador.dataset.posy=mensaje.datos.posy;
            nuevoJugador.dataset.puntos = mensaje.datos.puntos || 0;
            nuevoJugador.style.top=mensaje.datos.posy+"px";
            nuevoJugador.style.left=mensaje.datos.posx+"px";
            nuevoJugador.innerHTML = mensaje.datos.puntos || 0;
            document.getElementById("juego").appendChild(nuevoJugador);
        }
        else if (mensaje.tipo=="delete")
        {
            document.getElementById(mensaje.datos).remove();
        }
        else if(mensaje.tipo=="mover")
        {
            j=document.getElementById(mensaje.datos.id);
            j.dataset.dir=mensaje.datos.dir;
            j.dataset.posy=mensaje.datos.posy;
            j.dataset.posx=mensaje.datos.posx;
        } 
        else if (mensaje.tipo=="fruta")
        {
            if(!frutaDiv){
                frutaDiv=document.createElement("div");
                frutaDiv.className="fruta";
                document.getElementById("juego").appendChild(frutaDiv);
            }
            frutaDiv.style.left=mensaje.datos.x+"px";
            frutaDiv.style.top=mensaje.datos.y+"px";
        }
        else if(mensaje.tipo=="puntos")
        {
            mensaje.datos.forEach((j)=>{
                var div= document.getElementById(j.id);
                if(div) div.innerHTML= j.puntos;
            });
        }
    });
});


document.addEventListener("keydown",(ev)=>{
    var yo= document.getElementById(miId);
    //avisa al server de que me quiero mover 
    mensaje={
        tipo:"mover",
        datos: {
            id:miId,
            posx:yo.dataset.posx,
            posy:yo.dataset.posy,
            dir:ev.key
        },
    };

miconexion.send(JSON.stringify(mensaje));
});

document.addEventListener("keyup", (ev)=>{
var yo=document.getElementById(miId);
mensaje={
        tipo:"mover",
        datos:{
            id:miId,
            posx:yo.dataset.posx,
            posy:yo.dataset.posy,
            dir:"0",
        },
    };
miconexion.send(JSON.stringify(mensaje));
})

//animar automaticamente la posicion de los jugadores y comprobar la colision de la fruta 
setInterval(()=>{

    //buscat todos los jugadores(divs de la clase"jugador)
    var listaJugadores=document.getElementsByClassName("jugador");
    if(listaJugadores.length<1)return;

    //para cada uno...
    for(var i=0;i<listaJugadores.length;i++){

        j=listaJugadores[i];
        var direccion=j.dataset.dir;

        if(direccion=="a"){
            j.dataset.posx=Number(j.dataset.posx)-20;
        }else if(direccion=="d"){
            j.dataset.posx=Number(j.dataset.posx)+20;
        }else if(direccion=="w"){
            j.dataset.posy=Number(j.dataset.posy)-20;
        }else if(direccion=="s"){
            j.dataset.posy=Number(j.dataset.posy)+20;
        }

         //limitar rango de mov
        if(j.dataset.posx<0)j.dataset.posx=0;// si menor del minimo=corregir al minimo
        if(j.dataset.posx>480) j.dataset.posx=480;//si >max=corregir al max
        if(j.dataset.posy<0)j.dataset.posy=0;// si menor del minimo=corregir al minimo
        if(j.dataset.posy>480) j.dataset.posy=480;//si >max=corregir al max

       //var jugador=document.getElementById(id);
       j.style.top=j.dataset.posy+"px";
       j.style.left=j.dataset.posx+"px";
       
    };

    if (miId !=-1&& frutaDiv){
        yo=document.getElementById(miId);
        x=Number(yo.dataset.posx);
        y=Number(yo.dataset.posy);
        fx=parseInt(frutaDiv.style.left);
        fy=parseInt(frutaDiv.style.top);

        if(Math.abs(x-fx)<20 && Math.abs(y-fy)<20){
            miconexion.send(JSON.stringify({tipo:"coger"}));
        }
    }
},200);

</script>

</html>
